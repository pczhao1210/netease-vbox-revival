name: Multi-Architecture Images
on:
  workflow_dispatch:
    inputs:
      image:
        description: Lowercase GHCR image, for example ghcr.io/owner/neteast-spk-server
        type: string
        required: true
      publish:
        description: Publish the ARM64 and AMD64 manifest list to GHCR as :latest
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check native runner architecture
        run: |
          [[ "$(uname -m)" == "$TARGET_MACHINE" ]]
      - name: Build native runtime image
        run: |
          docker buildx build --platform "$TARGET_PLATFORM" --target runtime --load -t spk-smoke:runtime .
      - name: Run offline container preflight
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --platform "$TARGET_PLATFORM" spk-smoke:runtime preflight --voice --strict
          docker run --rm --network none --read-only --platform "$TARGET_PLATFORM" --entrypoint node spk-smoke:runtime --version
      - name: Run regression inside native runtime image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --platform "$TARGET_PLATFORM" \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$PWD/device,dst=/app/device,readonly" \
            --mount "type=bind,src=$PWD/docker-bake.json,dst=/app/docker-bake.json,readonly" \
            --mount "type=bind,src=$PWD/Dockerfile,dst=/app/Dockerfile,readonly" \
            --mount "type=bind,src=$PWD/compose.yaml,dst=/app/compose.yaml,readonly" \
            --mount "type=bind,src=$PWD/start.sh,dst=/app/start.sh,readonly" \
            --mount "type=bind,src=$PWD/.github,dst=/app/.github,readonly" \
            --entrypoint python spk-smoke:runtime -m unittest discover -s /app/tests -v
  build:
    needs: native-smoke
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}:latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image parameters
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+:latest$ ]]
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v3
      - name: Check builder platform support
        run: docker buildx inspect --bootstrap
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v6
        with:
          files: docker-bake.json
          push: ${{ inputs.publish }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Check published architectures
        if: inputs.publish
        run: docker buildx imagetools inspect "$IMAGE"
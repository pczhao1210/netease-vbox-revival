name: Offline Regression
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: sudo -n apt-get update && sudo -n apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements-voice.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/spk_test_netguard_pm.py
      - run: sh -n device/spk_agent_v2.sh
      - run: node --check src/spk_platform/static/app.js
      - run: node --check src/spk_platform/static/music-access.js
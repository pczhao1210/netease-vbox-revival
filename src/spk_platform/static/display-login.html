<!doctype html>
<html lang="zh-CN" data-theme="eink">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPK / 显示屏登录</title>
    <link rel="stylesheet" href="/static/display.css" />
  </head>
  <body>
    <main class="display layout-{{ layout }}">
      <header><strong>SPK / 网易音箱</strong></header>
      <h1>显示屏登录</h1>
      {% if configured %}
      <form method="post" action="/display/login?layout={{ layout }}">
        <input type="hidden" name="csrf" value="{{ csrf }}" /><label
          for="password"
          >管理员密码</label
        ><input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
        /><button type="submit">登录</button>
      </form>
      {% else %}
      <p>管理员尚未初始化</p>
      <a href="/">管理</a>{% endif %}
    </main>
  </body>
</html>
